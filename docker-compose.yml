services:
  plex-toolkit:
    image: ghcr.io/timlaws1/plex-toolkit:latest
    build: .
    container_name: plex-toolkit
    ports:
      - "8787:8787"
    environment:
      # Required: set in .env — do not use a weak or default password
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PORT: 8787
      DATA_DIR: /data
      # Optional stable OAuth client id (otherwise generated under /data/config/client.id)
      PLEX_CLIENT_ID: ${PLEX_CLIENT_ID:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # Optional: restrict fs.read tools (Preroll) to these roots
      # MEDIA_ROOTS: /prerolls
    volumes:
      - ./data:/data
      # Optional: preroll media for Preroll Scheduler
      # - ./prerolls:/prerolls
      # Optional: lets Home → Update replace this container.
      # DOCKER_GID is the group that owns /var/run/docker.sock on the host.
       - /var/run/docker.sock:/var/run/docker.sock
     group_add:
       - "${DOCKER_GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
