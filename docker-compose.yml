services:
  plex-toolkit:
    build: .
    container_name: plex-toolkit
    ports:
      - "8787:8787"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      PORT: 8787
      DATA_DIR: /data
      # Optional stable OAuth client id (otherwise generated under /data/config/client.id)
      PLEX_CLIENT_ID: ${PLEX_CLIENT_ID:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      CATALOGUE_URL: ${CATALOGUE_URL:-}
      # PLUGIN_LOCAL_ROOTS only useful when mounting source for development
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
